[package]
name = "paopaodns-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Policy DNS forwarder for OpenWrt inspired by PaoPaoDNS"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hickory-proto = { version = "0.26.2", default-features = false, features = ["std"] }
lru = "0.16"
maxminddb = "0.24"
regex = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
